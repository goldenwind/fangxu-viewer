[package]
name = "fangxu-viewer"
version = "0.1.2"
description = "Cross-platform minimalist image viewer by Fangxu"
authors = ["fangxu"]
edition = "2021"

[lib]
name = "fangxu_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
tauri-plugin-opener = "2"
os_info = { version = "3", default-features = false }
semver = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
tokio = { version = "1", features = ["fs", "io-util"] }
trash = "5.2"
kamadak-exif = "0.6"
arboard = "3"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp", "ico", "tga", "pnm", "qoi", "hdr", "dds", "exr", "ff"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen"] }
