<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: macOS dark slate matching app UI theme -->
    <linearGradient id="bgDark" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e232d"/>
      <stop offset="100%" stop-color="#0f1217"/>
    </linearGradient>

    <!-- Squircle Border Highlight -->
    <linearGradient id="borderDark" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)"/>
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Accent Sky-Blue Gradient for Title Icon -->
    <linearGradient id="accentLine" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Mountain Area Translucent Gradient -->
    <linearGradient id="mountDark" x1="12" y1="12" x2="12" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.28)"/>
      <stop offset="100%" stop-color="rgba(2, 132, 199, 0.04)"/>
    </linearGradient>

    <!-- Photo Frame Glass Background Gradient -->
    <linearGradient id="frameDark" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.08)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.45)"/>
    </linearGradient>
  </defs>

  <!-- Clean squircle shadow using stacked transparent layers -->
  <rect x="100" y="118" width="824" height="824" rx="185" ry="185" fill="black" fill-opacity="0.08"/>
  <rect x="100" y="112" width="824" height="824" rx="185" ry="185" fill="black" fill-opacity="0.12"/>
  <rect x="100" y="106" width="824" height="824" rx="185" ry="185" fill="black" fill-opacity="0.16"/>

  <!-- Squircle Base -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bgDark)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="url(#borderDark)" stroke-width="2"/>

  <!-- Scaled Title Icon Geometry -->
  <g transform="translate(248, 248) scale(22)">
    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" fill="url(#frameDark)"/>
    <path d="M6 21 L17.914 11.914 A2 2 0 0 1 20.742 11.914 L21 12.172 V21 H6 Z" fill="url(#mountDark)"/>

    <g stroke="url(#accentLine)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <circle cx="9" cy="9" r="2" fill="#38bdf8" fill-opacity="0.3"/>
      <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
    </g>
  </g>
</svg>
